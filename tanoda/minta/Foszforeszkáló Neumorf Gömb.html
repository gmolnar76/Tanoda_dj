<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foszforeszkáló Neumorf Gömb Dizájn</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --shadow-dark: #06090f;
            --shadow-light: #0e131f;
            --glow-color: #4ecca3;
            --text-color: #ffffff;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            perspective: 1000px;
        }
        
        .sphere-btn {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        
        .sphere {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #111e2c, #0a0e17);
            box-shadow: 6px 6px 12px var(--shadow-dark),
                        -6px -6px 12px var(--shadow-light),
                        inset 2px 2px 4px var(--shadow-light), 
                        inset -2px -2px 4px var(--shadow-dark);
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }
        
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 0 20px 2px rgba(78, 204, 163, 0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .sphere-btn:hover .glow {
            opacity: 1;
            animation: pulse 2s infinite;
        }
        
        .sphere-btn:hover .sphere {
            transform: translateZ(10px);
        }
        
        .sphere-btn:hover {
            transform: translateY(-10px) rotateX(20deg);
        }
        
        .content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            z-index: 1;
        }
        
        .symbol {
            font-size: 34px;
            color: var(--glow-color);
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
            margin-bottom: 8px;
            transform: translateZ(20px);
            transition: all 0.5s ease;
        }
        
        .label {
            color: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px) translateZ(20px);
            transition: all 0.5s ease;
            text-align: center;
            width: 100px;
        }
        
        .sphere-btn:hover .label {
            opacity: 0.8;
            transform: translateY(40px) translateZ(20px);
        }
        
        .sphere-btn:hover .symbol {
            transform: translateZ(30px);
        }
        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: var(--glow-color);
            border-radius: 50%;
            animation: float 3s infinite;
            opacity: 0;
        }
        
        .sphere-btn:hover .particles {
            opacity: 1;
        }
        
        .sphere-btn:hover .particle {
            opacity: 0.6;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 20px 2px rgba(78, 204, 163, 0.1); }
            50% { box-shadow: 0 0 30px 4px rgba(78, 204, 163, 0.3); }
            100% { box-shadow: 0 0 20px 2px rgba(78, 204, 163, 0.1); }
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
        
        /* Particle positioning */
        .particle:nth-child(1) { --tx: 30px; --ty: -40px; animation-delay: 0s; top: 50%; left: 50%; }
        .particle:nth-child(2) { --tx: -25px; --ty: -35px; animation-delay: 0.3s; top: 50%; left: 50%; }
        .particle:nth-child(3) { --tx: 40px; --ty: 10px; animation-delay: 0.1s; top: 50%; left: 50%; }
        .particle:nth-child(4) { --tx: -30px; --ty: 30px; animation-delay: 0.5s; top: 50%; left: 50%; }
        .particle:nth-child(5) { --tx: 10px; --ty: 40px; animation-delay: 0.2s; top: 50%; left: 50%; }
        
        /* Sphere button variations */
        .sphere-btn:nth-child(2) .symbol {
            font-size: 32px;
        }
        
        /* Animation for 3D effect */
        @keyframes rotate3d {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sphere-btn">
            <div class="sphere">
                <div class="glow"></div>
            </div>
            <div class="content">
                <div class="symbol">∫</div>
                <div class="label">Analízis</div>
            </div>
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
        
        <div class="sphere-btn">
            <div class="sphere">
                <div class="glow"></div>
            </div>
            <div class="content">
                <div class="symbol">∞</div>
                <div class="label">Sorozatok</div>
            </div>
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Dynamic 3D effect based on mouse movement
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const sphereBtns = document.querySelectorAll('.sphere-btn');
            
            const x = e.clientX / window.innerWidth - 0.5;
            const y = e.clientY / window.innerHeight - 0.5;
            
            sphereBtns.forEach(btn => {
                // Create subtle tilt effect based on mouse position
                btn.style.transform = `rotateY(${x * 20}deg) rotateX(${-y * 20}deg)`;
                
                // Adjust the sphere's inner shadow to simulate light movement
                const sphere = btn.querySelector('.sphere');
                sphere.style.background = `radial-gradient(circle at ${50 + x * 40}% ${50 + y * 40}%, #111e2c, #0a0e17)`;
            });
        });
    </script>
</body>
</html>

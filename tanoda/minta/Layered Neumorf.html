<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rétegelt Neumorf Minta</title>
    <style>
        :root {
            --bg-color: #222639;
            --shadow-dark: #1a1e2d;
            --shadow-light: #2a2e45;
            --accent-color: #4ecca3;
            --text-color: #e0e6f2;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .menu-card {
            width: 180px;
            height: 180px;
            position: relative;
            z-index: 1;
        }
        
        .card-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1e2233, #262a3f);
            border-radius: 20px;
            box-shadow: 10px 10px 20px var(--shadow-dark),
                       -10px -10px 20px var(--shadow-light);
            z-index: 1;
            transition: all 0.4s ease;
        }
        
        .card-top {
            position: absolute;
            width: 95%;
            height: 95%;
            top: 2.5%;
            left: 2.5%;
            background: linear-gradient(145deg, #20243a, #24283f);
            border-radius: 15px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark),
                        inset -3px -3px 6px var(--shadow-light);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }
        
        .icon-container {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #20243a, #24283f);
            border-radius: 50%;
            box-shadow: 4px 4px 8px var(--shadow-dark),
                       -4px -4px 8px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 3;
            transition: all 0.3s ease;
        }
        
        .icon {
            font-size: 30px;
            color: var(--accent-color);
            transition: all 0.3s ease;
        }
        
        .title {
            color: var(--text-color);
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .menu-card:hover .card-base {
            box-shadow: 15px 15px 25px var(--shadow-dark),
                        -15px -15px 25px var(--shadow-light);
        }
        
        .menu-card:hover .card-top {
            transform: translate(3px, 3px);
        }
        
        .menu-card:hover .icon-container {
            transform: scale(1.1);
            box-shadow: 6px 6px 12px var(--shadow-dark),
                      -6px -6px 12px var(--shadow-light);
        }
        
        .menu-card:hover .icon {
            transform: rotate(-10deg);
        }
        
        .menu-card:active .card-top {
            transform: translate(5px, 5px);
            box-shadow: inset 5px 5px 10px var(--shadow-dark),
                        inset -5px -5px 10px var(--shadow-light);
        }
        
        .menu-card:active .icon-container {
            box-shadow: inset 2px 2px 5px var(--shadow-dark),
                        inset -2px -2px 5px var(--shadow-light);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu-card">
            <div class="card-base"></div>
            <div class="card-top">
                <div class="icon-container">
                    <div class="icon">π</div>
                </div>
                <div class="title">Geometria</div>
            </div>
        </div>
        
        <div class="menu-card">
            <div class="card-base"></div>
            <div class="card-top">
                <div class="icon-container">
                    <div class="icon">√</div>
                </div>
                <div class="title">Algebra</div>
            </div>
        </div>
    </div>
</body>
</html>

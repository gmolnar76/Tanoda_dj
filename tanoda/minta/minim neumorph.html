<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalista Neumorf Minta</title>
    <style>
        :root {
            --bg-color: #161c30;
            --shadow-dark: #121626;
            --shadow-light: #1a223a;
            --accent: #6b8afd;
            --secondary: #fd6b8a;
            --text: #ffffff;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .card {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 8px 8px 16px var(--shadow-dark),
                       -8px -8px 16px var(--shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(
                circle at center,
                rgba(107, 138, 253, 0.15),
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card:active {
            transform: translateY(0);
            box-shadow: 4px 4px 8px var(--shadow-dark),
                       -4px -4px 8px var(--shadow-light),
                        inset 2px 2px 4px var(--shadow-dark),
                        inset -2px -2px 4px var(--shadow-light);
        }
        
        .icon {
            font-size: 30px;
            color: var(--accent);
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        
        .card:hover .icon {
            transform: translateY(-3px);
        }
        
        .label {
            font-size: 12px;
            color: var(--text);
            font-weight: 500;
            opacity: 0.7;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .card:hover .label {
            opacity: 1;
        }
        
        .card:nth-child(2) .icon {
            color: var(--secondary);
        }
        
        .card:nth-child(2)::before {
            background: radial-gradient(
                circle at center,
                rgba(253, 107, 138, 0.15),
                transparent 70%
            );
        }
        
        .card:nth-child(3) .icon {
            color: #6bfd8a;
        }
        
        .card:nth-child(3)::before {
            background: radial-gradient(
                circle at center,
                rgba(107, 253, 138, 0.15),
                transparent 70%
            );
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">+</div>
            <div class="label">Összeadás</div>
        </div>
        
        <div class="card">
            <div class="icon">−</div>
            <div class="label">Kivonás</div>
        </div>
        
        <div class="card">
            <div class="icon">×</div>
            <div class="label">Szorzás</div>
        </div>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tanoda Admin{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontawesome ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Alapstílusok -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
    </style>
    
    <!-- Plotly.js a grafikonokhoz -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <!-- Extra CSS fájl -->
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-gray-900 text-white">
    <div id="app">
        <!-- React applikáció itt lesz betöltve -->
        <div id="react-root"></div>
    </div>

    <!-- Alap JS függőségek -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    
    <!-- Django context adatok átadása a JS-nek -->
    <script>
        window.djangoContext = {
            csrfToken: '{{ csrf_token }}',
            user: {
                id: '{{ request.user.id }}',
                username: '{{ request.user.username }}',
                isStaff: {% if request.user.is_staff %}true{% else %}false{% endif %},
                isTeacher: {% if request.user.is_teacher %}true{% else %}false{% endif %}
            },
            {% if selected_class %}
            selectedClass: '{{ selected_class }}',
            {% endif %}
            staticUrl: '{% get_static_prefix %}'
        };
    </script>
    
    <!-- Babel a JSX szintaxis támogatásához -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Admin JS alkalmazás -->
    <script src="{% static 'js/admin-bundle.js' %}"></script>
    
    {% block extra_scripts %}{% endblock %}
    
    <!-- Logout megerősítő dialógus -->
    <div id="logout-confirm" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md mx-auto">
            <h3 class="text-xl font-bold mb-4">Kijelentkezés megerősítése</h3>
            <p class="mb-6">Biztosan ki szeretne jelentkezni?</p>
            <div class="flex justify-end space-x-4">
                <button id="logout-cancel" class="px-4 py-2 bg-gray-700 rounded-lg">Mégsem</button>
                <form method="post" action="{% url 'account:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg">Kijelentkezés</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Kijelentkezés megerősítő dialógus kezelése
        document.addEventListener('DOMContentLoaded', function() {
            const logoutButtons = document.querySelectorAll('.logout-button');
            const logoutConfirm = document.getElementById('logout-confirm');
            const logoutCancel = document.getElementById('logout-cancel');
            
            logoutButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    logoutConfirm.classList.remove('hidden');
                });
            });
            
            logoutCancel.addEventListener('click', function() {
                logoutConfirm.classList.add('hidden');
            });
        });
    </script>
</body>
</html>

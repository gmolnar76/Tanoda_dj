{% extends "egesz_szamok/eg_szamok_szorzasa.html" %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/kordinata_dark.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
<style>
  /* React app styling */
  .chart-container {
    background-color: #1a1a2e;
    border-radius: 5px;
    padding: 10px;
    margin-bottom: 20px;
  }
</style>
{% endblock %}

{% block kordinata_content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">Vizuálisan</h2>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="coord-tab" data-bs-toggle="tab" data-bs-target="#coord" type="button" role="tab" aria-controls="coord" aria-selected="true">Koordináták</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pitagorasz-tab" data-bs-toggle="tab" data-bs-target="#pitagorasz" type="button" role="tab" aria-controls="pitagorasz" aria-selected="false">Pitagorasz Tábla</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="population-tab" data-bs-toggle="tab" data-bs-target="#population" type="button" role="tab" aria-controls="population" aria-selected="false">Világ Népesség</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="civilization-tab" data-bs-toggle="tab" data-bs-target="#civilization" type="button" role="tab" aria-controls="civilization" aria-selected="false">Szén ciklus</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="civilization-tab" data-bs-toggle="tab" data-bs-target="#civilization" type="button" role="tab" aria-controls="civilization" aria-selected="false">Életmódgyorsulás</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="civilization-tab" data-bs-toggle="tab" data-bs-target="#civilization" type="button" role="tab" aria-controls="civilization" aria-selected="false">Tech fejlődésS</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- This is where all React components will be mounted -->
            <div 
                id="react-tab-container" 
                data-react-tab-content 
                data-chart-data='{{ chart_data }}'
                data-active-tab="coord"
                class="mt-4"
            ></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
    {{ block.super }}
    <!-- Remove all Plotly references and the old JS files -->
    
    <!-- Add Chart.js dependency -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React bundle that now contains all the chart components -->
    <script src="{% static 'js/bundles/plotly_chart.bundle.js' %}"></script>
{% endblock %}

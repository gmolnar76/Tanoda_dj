{% extends "plotly/kordinata/kordinata_1.html" %}
{% load static %}

{% block tab_content %}
  <!-- Civilizáció gyorsulása tab tartalma -->
  <div class="tab-pane fade" id="civilization" role="tabpanel" aria-labelledby="civilization-tab">
    <div class="container mt-4">
        <h3>Az emberi civilizáció felgyorsulása</h3>
        <div id="szenciklusPlot"></div>
        <div class="control-panel">
            <div>
                <label for="xaxis-scale">X tengely skála:</label>
                <select id="xaxis-scale" onchange="updateAxisType('xaxis')">
                    <option value="log">Logaritmikus</option>
                    <option value="linear">Lineáris</option>
                </select>
            </div>
            <div>
                <label for="yaxis-scale">Y tengely skála:</label>
                <select id="yaxis-scale" onchange="updateAxisType('yaxis')">
                    <option value="log">Logaritmikus</option>
                    <option value="linear">Lineáris</option>
                </select>
            </div>
        </div>
        <button onclick="addExplanation()" class="btn btn-primary mt-3">Magyarázat megjelenítése</button>
        <div id="szenciklusExplanation" class="mt-3"></div>
        <!-- Új kvíz szekció -->
        <div class="mt-5">
            <h4>Kvíz: Teszteld tudásod a civilizáció felgyorsulásáról!</h4>
            <div id="civilizationQuiz"></div>
        </div>
    </div>
</div>
        <!--PITAGORASZ TÁBLA -->
{% endblock %}

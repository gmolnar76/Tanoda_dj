{% extends "plotly/kordinata/kordinata_1.html" %}
{% load static %}

{% block tab_content %}

<div class="tab-pane fade" id="population" role="tabpanel" aria-labelledby="population-tab">
    <div class="container-fluid mt-4 p-0">
        <h3 class="mb-4">A világ népessége régiók szerint 1950-2100</h3>
        <div id="world-population-graph"></div>
        <div class="mt-3">Forrás: ENSZ előreszámítás, közepes változat (2010)</div>
        <div class="row mt-4">
            <div class="col-md-6">
                <div id="date-range-selector" class="d-flex align-items-center">
                    <input type="number" id="start-year" min="1950" max="2100" value="1950" class="form-control">
                    <span class="mx-2">-</span>
                    <input type="number" id="end-year" min="1950" max="2100" value="2100" class="form-control">
                    <span class="mx-2"></span>
                    <button id="update-chart" class="btn btn-outline-primary ms-2" title="Frissítés">
                        <i class="bi bi-yin-yang"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-6">
                <h4>Lekérdezés</h4>
                <div class="query-container">
                    <select id="query-type" class="form-control">
                        <option value="total-growth">Teljes növekedés</option>
                        <option value="average-growth-rate">Átlagos növekedési ráta</option>
                        <option value="total-population">Teljes népesség</option>
                        <option value="projected-population-2100">Előrejelzett népesség 2100-ban</option>
                    </select>
                    <button id="run-query" class="btn btn-outline-primary" title="Lekérdezés futtatása">
                        <i class="bi bi-yin-yang"></i>
                    </button>
                </div>
                <div id="query-result" class="mt-2"></div>
            </div>
        </div>

        <div class="feedback-container">
            <h4>Mennyire volt könnyű vagy nehéz a grafikon leolvasása?</h4>
            <div class="feedback-icons">
                <i class="bi bi-hand-thumbs-up" id="like-icon" title="Könnyű volt"></i>
                <i class="bi bi-hand-thumbs-down" id="dislike-icon" title="Nehéz volt"></i>
            </div>
            <p id="feedback-message" class="mt-2" style="display: none;"></p>
        </div>
        
        <!-- Új konténer a quiz elemeknek -->
        <div class="row mt-5">
            <div class="col-12">
                <h3>Népesség Kvíz</h3>
                <div id="quiz-container" class="mt-3">
                    <!-- A quiz kérdések ide lesznek betöltve -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

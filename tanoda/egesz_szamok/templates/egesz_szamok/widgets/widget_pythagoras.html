{% load static %}
<!-- Pythagorasz Table Widget -->
<div class="widget-header">
    <h3><i class="fas fa-th"></i> Pitagorasz Tábla</h3>
    <div class="widget-header-actions">
        <!-- Filter Dropdown -->
        <select class="glass-select" id="pythagoras-filter" onchange="filterPythagorasTable(this.value)">
            <option value="all">Mind</option>
            <option value="2">2-es tábla</option>
            <option value="3">3-as tábla</option>
            <option value="4">4-es tábla</option>
            <option value="5">5-ös tábla</option>
            <option value="6">6-os tábla</option>
            <option value="7">7-es tábla</option>
            <option value="8">8-as tábla</option>
            <option value="9">9-es tábla</option>
            <option value="10">10-es tábla</option>
        </select>

        <!-- Expand Button -->
        <button class="btn-expand" onclick="expandWidget(this)" title="Nagyítás">
            <i class="fas fa-expand"></i>
        </button>
        <button class="btn-reset" onclick="setPitagorasScoring(false); resetPracticeSession(true);" title="Reset">
            <i class="fas fa-redo"></i>
        </button>
    </div>
</div>

<div class="widget-body pythagoras-widget" id="pythagoras-widget">
    <!-- Pythagorasz Table Container -->
    <div class="pythagoras-table-container">
        <div id="pythagoras-table" class="pythagoras-table pythagoras-compact"></div>
    </div>

    <!-- Heatmap Legend -->
    <div class="pythagoras-heatmap-legend">
        <span class="pythagoras-legend-item">
            <span class="pythagoras-legend-color pythagoras-green"></span>
            Helyes
        </span>
        <span class="pythagoras-legend-item">
            <span class="pythagoras-legend-color pythagoras-red"></span>
            Hibás
        </span>
        <span class="pythagoras-legend-item">
            <span class="pythagoras-legend-color pythagoras-neutral"></span>
            Nem próbált
        </span>
    </div>

    <!-- Quick Filter Buttons -->
</div>

<script>
    // Filter Pythagoras table by multiplier
    function filterPythagorasTable(value) {
        const table = document.getElementById('pitagorasz-tabla');
        if (!table) return;

        const cells = table.querySelectorAll('.grid-item:not(.header-cell)');

        if (value === 'all') {
            cells.forEach(cell => cell.style.opacity = '1');
        } else {
            const multiplier = parseInt(value);
            cells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                if (row === multiplier || col === multiplier) {
                    cell.style.opacity = '1';
                    cell.style.background = 'rgba(78, 204, 163, 0.2)';
                } else {
                    cell.style.opacity = '0.3';
                    cell.style.background = '';
                }
            });
        }
    }

    // Set table size
    function setTableSize(size, btn) {
        // Update active button
        document.querySelectorAll('.table-filter .filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        // Rebuild table with new size
        if (typeof buildPitagoraszTable === 'function') {
            buildPitagoraszTable(size);
        }
    }

    // Scroll widget into view when expanded
    function scrollToTableIfNeeded() {
        const widget = document.getElementById('pythagoras-widget');
        if (widget) {
            widget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Expand widget functionality
    function expandWidget(button) {
        const widget = document.getElementById('pythagoras-widget-container');
        const overlay = document.createElement('div');
        overlay.className = 'widget-overlay';

        if (!widget.classList.contains('expanded')) {
            // Expand
            widget.classList.add('expanded');
            overlay.classList.add('show');
            document.body.appendChild(overlay);
            button.querySelector('i').classList.remove('fa-expand');
            button.querySelector('i').classList.add('fa-compress');

            // Close on overlay click
            overlay.addEventListener('click', () => {
                widget.classList.remove('expanded');
                overlay.remove();
                button.querySelector('i').classList.remove('fa-compress');
                button.querySelector('i').classList.add('fa-expand');
            });
        } else {
            // Collapse
            widget.classList.remove('expanded');
            document.querySelector('.widget-overlay')?.remove();
            button.querySelector('i').classList.remove('fa-compress');
            button.querySelector('i').classList.add('fa-expand');
        }
    }
</script>

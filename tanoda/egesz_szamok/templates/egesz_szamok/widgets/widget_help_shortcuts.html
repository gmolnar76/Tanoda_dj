{% load static %}
<!-- Keyboard Shortcuts Help Widget -->
<div class="shortcuts-section text-center">
    <div class="text-muted small" style="opacity: 0.7;">
        <i class="fas fa-keyboard"></i>
        <span style="margin: 0 5px;">Billentyűparancsok:</span>
        <kbd class="shortcut-key">Enter</kbd> Válasz/Új
        <span style="margin: 0 4px;">|</span>
        <kbd class="shortcut-key">R</kbd> Reset
        <span style="margin: 0 4px;">|</span>
        <kbd class="shortcut-key">T</kbd> Tipp
        <span style="margin: 0 4px;">|</span>
        <kbd class="shortcut-key">C</kbd> Kihívás
        <span style="margin: 0 4px;">|</span>
        <kbd class="shortcut-key">H</kbd> Súgó
    </div>
</div>

<style>
    .shortcut-key {
        background-color: rgba(102, 126, 234, 0.3);
        padding: 2px 6px;
        border-radius: 3px;
        margin: 0 2px;
        font-family: monospace;
        font-size: 11px;
        display: inline-block;
    }
    .shortcuts-section {
        padding: 10px 0;
        margin-top: 10px;
    }
</style>

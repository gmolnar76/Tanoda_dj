{% load static %}
<!-- Leaderboard Widget -->
<div class="widget-header">
    <h3><i class="fas fa-trophy"></i> Top 5 Játékos</h3>
    <div class="widget-header-actions">
        <button class="btn-expand" onclick="expandWidget(this)" title="Nagyítás">
            <i class="fas fa-expand"></i>
        </button>
    </div>
</div>

<div class="widget-body" id="leaderboard-widget">
    <!-- Leaderboard List -->
    <ul id="leaderboard" class="leaderboard-list">
        <!-- Populated by JavaScript -->
    </ul>

    <!-- Empty State (if no data) -->
    <div class="leaderboard-empty" id="leaderboard-empty" style="display: none;">
        <i class="fas fa-trophy"></i>
        <p>Még nincs ranglistaadat.</p>
        <p style="font-size: 12px; opacity: 0.7;">Légy te az első a ranglistán!</p>
    </div>

    <!-- Current User Position (if not in top 5) -->
    {% if user.is_authenticated %}
    <div id="user-position" class="mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.05); display: none;">
        <div class="leaderboard-item" style="background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2);">
            <div class="leaderboard-rank default" id="user-rank-badge">-</div>
            <div class="leaderboard-user">
                <span class="leaderboard-name">{{ user.email|truncatechars:20 }} (Te)</span>
            </div>
            <span class="leaderboard-score" id="user-score" style="color: var(--neon-purple);">{{ osszes_pont|default:0 }}</span>
        </div>
    </div>
    {% endif %}
</div>

<!-- NOTE: Leaderboard loading handled by leaderboard_loader.js (ESM module) -->

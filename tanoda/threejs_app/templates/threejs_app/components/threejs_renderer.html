{% load static %}

<div id="threeJsRenderer" 
     class="threejs-renderer"
     data-width="{{ width }}"
     data-height="{{ height }}"
     data-scene="{{ scene }}"
     data-background-color="{{ background_color }}">
</div>

{% if debug %}
<div class="debug-info">
    <h3>Three.js Renderer Debugger</h3>
    <div id="threejs-status"><p>Inicializálás...</p></div>
    <div id="stats-container"></div>
</div>
{% endif %}
